e: +4.74 mm; nominal visible-to-key gap 10.55 mm</text></g><text x="0" y="133" font-family="Arial" font-size="3.9" fill="#cbd5df">Based on measured 2023 Waveshare STEP socket housings and existing Rev B positions. No physical plugs, cables or port cuts.</text><text x="0" y="140" font-family="Arial" font-size="3.8" fill="#f9b35e">Both orientations are concepts. Firmware display and touch 180° correction is required and untested.</text></svg>
