<text x="60" y="489" font-family="Arial" font-size="15" fill="#d8e1e9">Gold = captured side rail zones (underside). Pull tab is centered at rear. Screen screws remain.</text>
<text x="60" y="513" font-family="Arial" font-size="14" fill="#e9b779">No latch durability or full physical cable/board insertion proof. Do not fabricate as final design.</text>
