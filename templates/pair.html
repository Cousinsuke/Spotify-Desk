<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desk Thing · Pairing</title><style>
*{box-sizing:border-box}body{background:#0c1016;color:#f6f8fa;font:15px system-ui;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(580px,100%);background:#171c25;border:1px solid #343a45;border-radius:20px;padding:30px}h1{margin:0 0 12px}.muted{color:#adb6c4;line-height:1.55}#code{font-size:clamp(48px,10vw,76px);font-weight:750;letter-spacing:.17em;margin:18px 0}button{background:#e6f6ea;color:#102016;border:0;border-radius:10px;padding:12px 17px;cursor:pointer;font-weight:700;margin-right:8px}button.danger{background:#343b46;color:#fff}code{background:#262e39;padding:3px 6px;border-radius:4px}#msg{min-height:22px;color:#8edba7}ul{line-height:1.8}
</style></head><body><main><h1>Pair a Desk Thing</h1><p class="muted">This management page is available on the companion computer only. On another device, open <code>http://YOUR-COMPUTER-IP:8888/device</code> after starting the server with <code>--lan</code>.</p><div id="code">------</div><p id="remaining" class="muted"></p><button id="new">Generate new code</button><button class="danger" id="revoke">Revoke all devices</button><p id="msg"></p><h3>Paired devices</h3><ul id="list"></ul><a style="color:#a6dbc3" href="/device">Open local simulator</a></main><script>
async function refresh(){try{const r=await fetch('/api/device/pairing');const d=await r.json();document.getElementById('code').textContent=d.code||'------';document.getElementById('remaining').textContent=d.code?`${d.seconds_remaining} seconds remaining · code works once`:'Generate a new code to pair another device.';document.getElementById('list').replaceChildren(...(d.devices.length?d.devices:['No paired devices']).map(n=>{const li=document.createElement('li');li.textContent=n;return li;}));}catch(e){document.getElementById('msg').textContent=e.message;}}
async function post(path){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error('Request failed');await refresh();}
document.getElementById('new').onclick=async()=>{try{await post('/api/device/pairing/new');document.getElementById('msg').textContent='New code ready.';}catch(e){document.getElementById('msg').textContent=e.message;}};
document.getElementById('revoke').onclick=async()=>{if(!confirm('Revoke every paired device token?'))return;try{await post('/api/device/pairing/revoke-all');document.getElementById('msg').textContent='All devices revoked.';}catch(e){document.getElementById('msg').textContent=e.message;}};
refresh();setInterval(refresh,10000);
</script></body></html>
