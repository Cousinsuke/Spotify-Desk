plugins { id 'com.android.application' }
android {
    namespace 'com.spotifydesk.echo'
    compileSdk 35
    buildToolsVersion '34.0.0'
    defaultConfig {
        applicationId 'com.spotifydesk.echo'
        minSdk 30
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.res.srcDir(layout.buildDirectory.dir('generated/local-res').get().asFile)
    }
}
